name: Release

# Push a `v*` tag (e.g. v0.1.0) to build installers for macOS, Windows and Linux
# and publish them to a GitHub Release. `workflow_dispatch` runs the same build as
# a dry run (artifacts only, no release) so the pipeline can be exercised off-tag.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write # the release job creates/updates the GitHub Release

# Run the JS-based actions (checkout, setup-node, artifact, gh-release) on Node 24
# instead of the deprecated Node 20 runtime. GitHub forces this from 2026-06-16.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Gate the release on the existing test suite (unit + property + typecheck + purity).
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run verify

  # Build + package on each OS. No native modules, so macOS cross-builds arm64+x64
  # from a single runner. `--publish never`: artifacts are collected, the release
  # job below publishes them all at once.
  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --mac
          - os: windows-latest
            args: --win
          - os: ubuntu-latest
            args: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build and package
        run: |
          npm run build
          npx electron-builder ${{ matrix.args }} --publish never
        env:
          # Unsigned macOS build: don't go looking for a signing identity in CI.
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
          if-no-files-found: ignore
          retention-days: 7

  # Only on a real tag push: collect every OS's installers and publish one Release.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag matches package.json version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "$REF_NAME" ]; then
            echo "::error::Tag $REF_NAME does not match package.json version $PKG_VERSION. Bump package.json and re-tag."
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          fail_on_unmatched_files: false
          files: |
            artifacts/*.dmg
            artifacts/*.zip
            artifacts/*.exe
            artifacts/*.AppImage
            artifacts/*.deb
          body: |
            Sight Reading — practice tool (Electron prototype).

            > These builds are **not code-signed yet**. One-time steps to open them:
            >
            > - **macOS** (`.dmg`): after dragging to Applications, right-click the app → **Open** → **Open**.
            >   If you see "app is damaged", run: `xattr -cr "/Applications/Sight Reading.app"`.
            > - **Windows** (`-setup.exe`): SmartScreen → **More info** → **Run anyway**.
            > - **Linux**: `chmod +x` the `.AppImage` and run it, or `sudo dpkg -i` the `.deb`.

            **Pick your download:**
            - macOS Apple Silicon → `*-arm64.dmg` &nbsp;·&nbsp; macOS Intel → `*.dmg` (x64)
            - Windows → `Sight Reading-<version>-setup.exe`
            - Linux → `*.AppImage` or `*.deb`
